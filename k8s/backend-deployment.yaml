apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkora-backend
  labels:
    app: linkora-backend
spec:
  replicas: 3 # Scale to 3 pods for high availability
  selector:
    matchLabels:
      app: linkora-backend
  template:
    metadata:
      labels:
        app: linkora-backend
    spec:
      containers:
      - name: linkora-backend
        image: linkora/backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: linkora-secrets
              key: database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: linkora-secrets
              key: jwt-secret
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: linkora-secrets
              key: openai-key
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: linkora-secrets
              key: stripe-secret-key
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: linkora-secrets
              key: stripe-webhook-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/v1/auth/me
            port: 4000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/v1/auth/me
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: linkora-backend-service
spec:
  type: ClusterIP
  ports:
  - port: 4000
    targetPort: 4000
    protocol: TCP
    name: http
  selector:
    app: linkora-backend
