apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linkora-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
  - hosts:
    - app.linkora.io
    secretName: linkora-tls-cert
  rules:
  - host: app.linkora.io
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: linkora-backend-service
            port:
              number: 4000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: linkora-frontend-service
            port:
              number: 3000
